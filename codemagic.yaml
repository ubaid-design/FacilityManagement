workflows:
  facility-management-ios:
    name: Facility Management iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build unsigned iOS app (compile check)
        script: |
          xcodebuild \
            -project FacilityManagement.xcodeproj \
            -scheme FacilityManagement \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/DerivedData/Build/Products/Release-iphoneos/FacilityManagement.app
      - /tmp/xcodebuild_logs/*.log
