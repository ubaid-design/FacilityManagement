name: FacilityManagement
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
targets:
  FacilityManagement:
    type: application
    platform: iOS
    sources:
      - path: FacilityManagement
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.facilitymanagement
        PRODUCT_NAME: FacilityManagement
        INFOPLIST_FILE: FacilityManagement/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
